[package]
name = "pen-fight"
version = "0.1.0"
description = "Pen Fight: a 1v1 desk-flick game on MagicBlock Ephemeral Rollups with a SOL pot"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pen_fight"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }
